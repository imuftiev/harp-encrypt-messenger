[project]
name = "harp"
version = "1.0.0"
description = "Harp Messanger — is a web-application for secure exchange between users, with the ability to choose an encrpytion algorithm."
authors = [
    {name = "imcode",email = "128029980+ilyas11m@users.noreply.github.com"}
]
license = "Apache 2.0"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy[asyncio] (>=2.1.9,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "fastapi (>=0.162.2,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "sqlalchemy-crud-plus (>=1.13.3,<2.0.0)",
    "pwdlib[argon2] (>=0.4.2,<0.5.0)",
    "email-validator (>=2.4.0,<3.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "python-multipart (>=0.0.34,<0.0.35)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
